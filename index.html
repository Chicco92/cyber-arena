<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberStrike 3D - FPS Web Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050711;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .cyber-panel {
            background: rgba(10, 15, 32, 0.78);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 211, 238, 0.35);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.15);
        }
        #damage-overlay {
            background: radial-gradient(circle, transparent 45%, rgba(239, 68, 68, 0.65) 100%);
            transition: opacity 0.18s ease-out;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- CANVAS 3D PRINCIPALE -->
    <canvas id="game-canvas"></canvas>

    <!-- OVERLAY DANNO RICEVUTO -->
    <div id="damage-overlay" class="fixed inset-0 pointer-events-none z-10 opacity-0"></div>

    <!-- MIRINO PERFETTAMENTE CENTRATO NEL VIEWPORT -->
    <div id="crosshair" class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none transition-transform duration-75">
        <div class="relative flex items-center justify-center">
            <div id="crosshair-dot" class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]"></div>
            <div class="crosshair-line absolute -top-3.5 w-0.5 h-2.5 bg-cyan-400/90 transition-all duration-150"></div>
            <div class="crosshair-line absolute -bottom-3.5 w-0.5 h-2.5 bg-cyan-400/90 transition-all duration-150"></div>
            <div class="crosshair-line absolute -left-3.5 h-0.5 w-2.5 bg-cyan-400/90 transition-all duration-150"></div>
            <div class="crosshair-line absolute -right-3.5 h-0.5 w-2.5 bg-cyan-400/90 transition-all duration-150"></div>
        </div>
    </div>

    <!-- OVERLAY MIRINO OTTICO ADS (Tasto Destro del Mouse) -->
    <div id="ads-overlay" class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-56 h-56 rounded-full border border-cyan-400/45 pointer-events-none z-20 opacity-0 scale-125 transition-all duration-150 flex items-center justify-center shadow-[0_0_40px_rgba(6,182,212,0.2)]">
        <div class="w-44 h-44 rounded-full border border-dashed border-cyan-300/30"></div>
        <div class="absolute w-full h-px bg-cyan-400/20"></div>
        <div class="absolute h-full w-px bg-cyan-400/20"></div>
        <div id="ads-zoom-label" class="absolute -top-6 text-[10px] font-cyber text-cyan-300 tracking-widest uppercase bg-slate-950/80 px-2 py-0.5 rounded border border-cyan-500/30">LOCK // ZOOM 1.6X</div>
    </div>

    <!-- MIRINO OTTICO TRASPARENTE SPECIFICO PER IL CECCHINO -->
    <div id="sniper-scope-overlay" class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 rounded-full border-2 border-rose-500/80 pointer-events-none z-20 opacity-0 scale-110 transition-all duration-150 flex items-center justify-center shadow-[0_0_60px_rgba(244,63,94,0.35)] bg-cyan-950/10 backdrop-brightness-125">
        <div class="absolute inset-0 rounded-full border border-rose-400/30"></div>
        <div class="absolute w-full h-0.5 bg-rose-500/70"></div>
        <div class="absolute h-full w-0.5 bg-rose-500/70"></div>
        <div class="w-40 h-40 rounded-full border border-rose-400/40"></div>
        <div class="absolute top-3 text-[10px] font-cyber text-rose-400 tracking-widest uppercase bg-slate-950/90 px-2 py-0.5 rounded border border-rose-500/40">RAILGUN V9 // OTTICA TRASPARENTE 3.2X</div>
    </div>

    <!-- HITMARKER CENTRATO -->
    <div id="hit-marker" class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 pointer-events-none z-20 opacity-0 transition-opacity duration-75">
        <div class="absolute inset-0 rotate-45 flex items-center justify-center">
            <div class="w-full h-0.5 bg-rose-500 shadow-[0_0_8px_#f43f5e]"></div>
        </div>
        <div class="absolute inset-0 -rotate-45 flex items-center justify-center">
            <div class="w-full h-0.5 bg-rose-500 shadow-[0_0_8px_#f43f5e]"></div>
        </div>
    </div>

    <!-- HUD PRINCIPALE -->
    <div id="game-hud" class="fixed inset-0 pointer-events-none z-20 flex flex-col justify-between p-3 sm:p-5">
        <div class="flex items-start justify-between gap-3">
            <div class="cyber-panel rounded-xl px-4 py-2.5 flex items-center gap-4 sm:gap-6 pointer-events-auto">
                <div>
                    <div class="text-[10px] font-cyber uppercase tracking-widest text-slate-400">Ondata</div>
                    <div id="hud-wave" class="text-xl sm:text-2xl font-cyber font-black text-cyan-400">01</div>
                </div>
                <div class="h-8 w-px bg-cyan-500/30"></div>
                <div>
                    <div class="text-[10px] font-cyber uppercase tracking-widest text-slate-400">Punteggio</div>
                    <div id="hud-score" class="text-xl sm:text-2xl font-cyber font-black text-white">0</div>
                </div>
                <div class="h-8 w-px bg-cyan-500/30"></div>
                <div>
                    <div class="text-[10px] font-cyber uppercase tracking-widest text-slate-400">Ostili</div>
                    <div id="hud-enemies" class="text-xl sm:text-2xl font-cyber font-black text-rose-400">0</div>
                </div>
            </div>

            <div class="flex items-start gap-2.5 pointer-events-auto">
                <button id="btn-mute" class="cyber-panel rounded-xl px-3 py-2 text-xs font-cyber text-cyan-300 hover:bg-cyan-500/20 transition">🔊 AUDIO</button>
                <button id="btn-pause" class="cyber-panel rounded-xl px-3 py-2 text-xs font-cyber text-slate-200 hover:bg-slate-700/40 transition">⏸ PAUSA</button>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row items-stretch sm:items-end justify-between gap-3">
            <div class="cyber-panel rounded-xl px-4 py-3 w-full sm:w-72">
                <div class="flex justify-between items-baseline mb-1.5">
                    <span class="text-[11px] font-cyber uppercase tracking-widest text-slate-300">Integrità Corazza</span>
                    <span id="hud-health-text" class="text-xl font-cyber font-bold text-emerald-400">100%</span>
                </div>
                <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden p-0.5">
                    <div id="hud-health-bar" class="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 rounded-full transition-all duration-200" style="width: 100%"></div>
                </div>
            </div>

            <div class="cyber-panel rounded-xl px-5 py-3 flex items-center justify-between sm:justify-end gap-5">
                <div class="text-left sm:text-right">
                    <div id="hud-weapon-name" class="text-xs font-cyber uppercase tracking-widest text-cyan-400 font-bold">Fucile d'Assalto MK-IV</div>
                </div>
                <div class="h-10 w-px bg-cyan-500/30"></div>
                <div class="flex items-baseline gap-1 font-cyber">
                    <span id="hud-ammo-clip" class="text-3xl sm:text-4xl font-black text-white">30</span>
                    <span class="text-lg text-slate-400">/</span>
                    <span id="hud-ammo-max" class="text-lg text-cyan-400 font-bold">30</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MENU OVERLAY -->
    <div id="menu-overlay" class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
        <div class="cyber-panel rounded-2xl max-w-lg w-full p-6 sm:p-8 border border-cyan-400/50 text-center relative overflow-hidden">
            <h1 class="text-3xl sm:text-4xl font-cyber font-black text-white tracking-wider uppercase mb-2">
                CYBERSTRIKE <span class="text-cyan-400">3D</span>
            </h1>
            <p class="text-sm text-slate-300 mb-6">Premi il pulsante per avviare la missione e bloccare il puntatore.</p>
            <button id="btn-start-game" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-cyber font-black text-base uppercase tracking-wider shadow-[0_0_25px_rgba(34,211,238,0.45)] transition transform active:scale-98 cursor-pointer">
                Inizia Missione
            </button>
        </div>
    </div>

    <script>
        class CyberSoundEngine {
            constructor() { this.ctx = null; this.enabled = true; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            toggle() { this.enabled = !this.enabled; return this.enabled; }
        }

        const sound = new CyberSoundEngine();

        // Inizializzazione Tre.js e logica di avvio
        let scene, camera, renderer;
        let isGameRunning = false;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050711);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Griglia Arena Base
            const grid = new THREE.GridHelper(100, 40, 0x22d3ee, 0x1e293b);
            grid.position.y = 0;
            scene.add(grid);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // Gestione tasto Avvio
        document.getElementById('btn-start-game').addEventListener('click', () => {
            sound.
