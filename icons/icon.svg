<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000208" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="4" />

  <!-- Outer Tech Reticle Circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="2" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Corner Brackets -->
  <path d="M 120 180 L 120 120 L 180 120" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonCyan)" />
  <path d="M 392 180 L 392 120 L 332 120" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonCyan)" />
  <path d="M 120 332 L 120 392 L 180 392" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonCyan)" />
  <path d="M 392 332 L 392 392 L 332 392" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonCyan)" />

  <!-- Sniper Crosshair Lines -->
  <line x1="256" y1="76" x2="256" y2="136" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#neonCyan)" />
  <line x1="256" y1="376" x2="256" y2="436" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#neonCyan)" />
  <line x1="76" y1="256" x2="136" y2="256" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#neonCyan)" />
  <line x1="376" y1="256" x2="436" y2="256" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#neonCyan)" />

  <!-- Center Hexagon / Shield -->
  <polygon points="256,150 348,203 348,309 256,362 164,309 164,203" fill="#030712" fill-opacity="0.85" stroke="url(#cyanGrad)" stroke-width="4" />
  <polygon points="256,166 332,210 332,298 256,342 180,298 180,210" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Futuristic Typography "CS3D" -->
  <text x="256" y="248" font-family="'Orbitron', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#neonCyan)">
    CYBER
  </text>
  <text x="256" y="306" font-family="'Orbitron', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="52" fill="url(#amberGrad)" text-anchor="middle" letter-spacing="3" filter="url(#neonAmber)">
    STRIKE 3D
  </text>

  <!-- Glowing Center Target Dot -->
  <circle cx="256" cy="328" r="4" fill="#f43f5e" />
  <circle cx="256" cy="328" r="8" fill="none" stroke="#f43f5e" stroke-opacity="0.7" stroke-width="2" />
</svg>
